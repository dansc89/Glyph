name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-x86_64:
    name: x86_64 Linux artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI/package deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libx11-dev libxi-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev desktop-file-utils fakeroot wget xvfb xdotool ffmpeg python3-pil tesseract-ocr xclip python3-pypdf
          cargo install cargo-deb --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Reset Pdfium bundled cache
        run: rm -rf ~/.cache/pdfium-bundled
      # Private drawing fixtures stay local; still run ignored portable benchmarks.
      - name: Test
        run: cargo test --locked -- --include-ignored --skip app::automation::tests::real_saltair_export_has_l1_11_bookmark_and_unchanged_rendering --skip pdf::automation::tests::real_saltair_rotated_titleblock_is_l1_11 --test-threads=1
      - name: Build release
        run: cargo build --locked --release
      - name: GUI smoke test
        run: python3 scripts/gui-qa.py --skip-build --out dist/gui-qa
      - name: Viewer regression checks
        run: python3 scripts/performance-qa.py --binary target/release/glyph --out dist/viewer-qa
      - name: Isolated markup save/recovery regression
        run: python3 scripts/markup-qa.py --binary target/release/glyph --shape ellipse --repeat-save --read-only-retry --imported-reals --out dist/markup-qa
      - name: Isolated synthetic 100-page native save stress
        run: python3 scripts/native-save-stress-qa.py --binary target/release/glyph --seed-pdf dist/markup-qa/mixed-shapes-proof.pdf --out dist/save-stress-qa
      - name: Display isolation checks
        run: python3 scripts/test-editing-qa-isolation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glyph-gui-qa-screenshots
          path: |
            dist/gui-qa/*.png
            dist/gui-qa/*.txt
            dist/gui-qa/*.log
            dist/viewer-qa/
            dist/markup-qa/
            dist/save-stress-qa/
      - name: Check portable runtime deps
        run: |
          mkdir -p dist
          ldd target/release/glyph | tee dist-ldd.txt
          if grep -E 'not found|libgtk|libgdk|libwebkit|libssl|libcrypto|libpdfium|libfuse' dist-ldd.txt; then
            echo "Unexpected non-baseline runtime dependency detected" >&2
            echo "Glyph release artifacts must not require GTK/WebKit/OpenSSL/PDFium/FUSE packages to be installed separately." >&2
            exit 1
          fi
      - name: Package tar.gz
        run: |
          mkdir -p dist/tar/glyph-arch-x86_64
          cp target/release/glyph dist/tar/glyph-arch-x86_64/glyph
          cp README.md dist/tar/glyph-arch-x86_64/README.md
          cp packaging/linux/glyph.desktop dist/tar/glyph-arch-x86_64/glyph.desktop
          cp packaging/linux/glyph.svg dist/tar/glyph-arch-x86_64/glyph.svg
          cp packaging/linux/install-tar.sh dist/tar/glyph-arch-x86_64/install-glyph.sh
          chmod +x dist/tar/glyph-arch-x86_64/install-glyph.sh
          cp packaging/linux/install-appimage.sh dist/install-glyph-appimage.sh
          chmod +x dist/install-glyph-appimage.sh
          cp packaging/linux/install-arch.sh dist/install-glyph-arch.sh
          chmod +x dist/install-glyph-arch.sh
          cp packaging/linux/glyph.svg dist/glyph.svg
          sh -n dist/tar/glyph-arch-x86_64/install-glyph.sh
          sh -n dist/install-glyph-appimage.sh
          sh -n dist/install-glyph-arch.sh
          tar -C dist/tar -czf dist/glyph-arch-x86_64.tar.gz glyph-arch-x86_64
          cp dist/glyph-arch-x86_64.tar.gz dist/glyph-x86_64-unknown-linux-gnu.tar.gz
      - name: Package deb
        run: |
          cargo deb --no-build --output dist/glyph-x86_64.deb
      - name: Package AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib/glyph AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp target/release/glyph AppDir/usr/lib/glyph/glyph-bin
          cp packaging/linux/glyph-launcher AppDir/usr/bin/glyph
          cp packaging/linux/glyph.desktop AppDir/usr/share/applications/glyph.desktop
          cp packaging/linux/glyph.svg AppDir/usr/share/icons/hicolor/scalable/apps/glyph.svg
          cp packaging/linux/glyph.desktop AppDir/glyph.desktop
          cp packaging/linux/glyph.svg AppDir/glyph.svg
          cp packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/glyph AppDir/usr/lib/glyph/glyph-bin
          desktop-file-validate AppDir/glyph.desktop
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool AppDir dist/Glyph-x86_64.AppImage
      - name: Generate checksums
        run: |
          cd dist
          sha256sum Glyph-x86_64.AppImage glyph-arch-x86_64.tar.gz glyph-x86_64-unknown-linux-gnu.tar.gz glyph-x86_64.deb install-glyph-appimage.sh install-glyph-arch.sh glyph.svg > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: glyph-linux-x86_64
          path: |
            dist/glyph-arch-x86_64.tar.gz
            dist/glyph-x86_64-unknown-linux-gnu.tar.gz
            dist/glyph-x86_64.deb
            dist/Glyph-x86_64.AppImage
            dist/install-glyph-appimage.sh
            dist/install-glyph-arch.sh
            dist/SHA256SUMS
            dist/glyph.svg

[package]
name = "glyph"
version = "1.6.0"
edition = "2024"
description = "PDF editor for Arch Linux."
license = "MIT"
repository = "https://github.com/dansc89/Glyph"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.36.2", default-features = true }
egui = "0.36.2"
lopdf = "0.45.0"
pdfium-bundled = { version = "0.2.0", features = ["bundled"] }
rfd = { version = "0.15.4", default-features = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.23"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[package.metadata.deb]
maintainer = "dansc89"
copyright = "2026, dansc89"
extended-description = "Glyph is a PDF editor for Arch Linux with drawing-set navigation, bookmarks, and link workflows."
section = "graphics"
priority = "optional"
assets = [
    ["target/release/glyph", "usr/lib/glyph/glyph-bin", "755"],
    ["packaging/linux/glyph-launcher", "usr/bin/glyph", "755"],
    ["packaging/linux/glyph.desktop", "usr/share/applications/glyph.desktop", "644"],
    ["packaging/linux/glyph.svg", "usr/share/icons/hicolor/scalable/apps/glyph.svg", "644"],
    ["README.md", "usr/share/doc/glyph/README.md", "644"],
]
